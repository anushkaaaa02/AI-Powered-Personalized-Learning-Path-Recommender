<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Analysis — PathWise</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body id="assessment-app">
<div class="grid-backdrop"></div>
<div class="aurora" style="position:fixed;inset:0;z-index:-1;"><span class="a1"></span><span class="a2"></span><span class="a3"></span><span class="a4"></span></div>

<nav class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="logo">
      <span class="logo-mark"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></span>
      PATHWISE // CAREER ANALYSIS
    </a>
    <div class="nav-actions">
      <button class="theme-toggle" data-theme-toggle><span data-theme-icon>🌙</span></button>
    </div>
  </div>
</nav>

<div class="container assess-shell">
  <div class="assess-head">
    <span class="eyebrow">CAREER ASSESSMENT</span>
    <span class="assess-count" id="q-count">QUESTION 01 / 05</span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>

  <h1 class="q-title" id="q-title"></h1>
  <div class="q-options" id="q-options"></div>

  <div class="assess-nav">
    <button class="btn btn-ghost" id="q-prev">← BACK</button>
    <button class="btn btn-primary" id="q-next" disabled>NEXT →</button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/theme.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/assessment.js"></script>
</body>
</html>
