<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — PathWise</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="grid-backdrop"></div>
<div class="aurora" style="position:fixed;inset:0;z-index:-1;"><span class="a1"></span><span class="a2"></span><span class="a3"></span><span class="a4"></span></div>

<nav class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="logo">
      <span class="logo-mark"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></span>
      PATHWISE
    </a>
    <div class="nav-actions">
      <button class="theme-toggle" data-theme-toggle><span data-theme-icon>🌙</span></button>
    </div>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-side">
    <div class="auth-nodes">
      <span style="top:25%;left:20%;"></span>
      <span style="top:55%;left:65%;animation-delay:1.2s;"></span>
      <span style="top:75%;left:35%;animation-delay:2.4s;"></span>
    </div>
    <div class="logo"><span class="logo-mark"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" stroke="currentColor" stroke-width="1.4"/></svg></span>PATHWISE</div>
    <span class="eyebrow">NAVIGATE YOUR FUTURE</span>
    <h1>WELCOME BACK.</h1>
    <p>Your learning journey is waiting.</p>
  </div>

  <div class="auth-form-side">
    <form class="auth-form" id="login-form" novalidate>
      <span class="eyebrow">SIGN IN</span>
      <h2>WELCOME BACK.</h2>
      <p class="sub">Your learning journey is waiting.</p>

      <div class="field">
        <label for="li-email">Email Address</label>
        <input type="email" id="li-email" placeholder="you@example.com" autocomplete="email">
        <div class="field-error"></div>
      </div>
      <div class="field">
        <div class="field-row">
          <label for="li-password" style="margin-bottom:0;">Password</label>
          <a href="#" style="font-size:.78rem;">Forgot Password?</a>
        </div>
        <input type="password" id="li-password" placeholder="••••••••" autocomplete="current-password">
        <div class="field-error"></div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;">SIGN IN →</button>
      <div class="form-msg" id="login-msg"></div>

      <div class="auth-foot">
        New to PathWise? <a href="signup.html">CREATE AN ACCOUNT →</a>
      </div>
    </form>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/theme.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
